<div *ngIf="!loading" class="notification-card">

  <div class="card-header">{{ 'PORTFOLIOS.PORTFOLIO_PERFORMANCE_NOTIFICATIONS' | translate }}</div>

  <div class="card-body">
    <div class="form-check">
      <input type="checkbox"
             class="form-check-input"
             id="enableNotifications"
             [(ngModel)]="notification.isEnabled" />
      <label class="form-check-label" for="enableNotifications">
        {{ 'PORTFOLIOS.ENABLE_NOTIFICATIONS' | translate }}
      </label>
    </div>
    <div *ngIf="notification.isEnabled" class="mt-3">
      <label class="form-label">{{ 'FREQUENCY' | translate }}</label>
      <select class="form-select"
              [(ngModel)]="notification.frequency">
        <option value="Weekly">{{ 'WEEKLY' | translate }}</option>
        <option value="Monthly">{{ 'MONTHLY' | translate }}</option>
      </select>
    </div>
    <div class="mt-4">
      <button class="btn btn-primary"
              (click)="save()"
              [disabled]="saving">
        <span *ngIf="!saving">{{ 'SAVE' | translate }}</span>
        <span *ngIf="saving">{{ 'SAVING' | translate }}...</span>
      </button>
    </div>

    <div *ngIf="saved" class="alert alert-success mt-3">{{ 'SAVE_SETTINGS_SUCCESS' | translate }}.</div>

    <p *ngIf="error" class="alert alert-danger mt-3">{{ 'SAVE_SETTINGS_ERROR' | translate }}.</p>
  </div>
</div>
