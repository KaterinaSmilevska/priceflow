<header>
  <nav class="navbar navbar-expand-lg navbar-dark bg-custom-dark border-bottom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" [routerLink]="['/']">
        <img src="../../assets/smlogo.png" alt="PriceFlow Logo" class="logo">
        <span class="ms-3 text-white fw-bold" style="font-size: 1.6rem; text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);">PriceFlow</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="navbar-nav ms-auto"></div>
        <div class="d-flex align-items-center justify-content-end">
          <div class="language-switch-container" *ngIf="!(loginService.isLoggedIn() | async)">
            <label class="language-switch">
              <input type="checkbox" id="languageToggle" (change)="toggleLanguage()">
              <span class="language-slider"></span>
            </label>
          </div>
          <div *ngIf="showLoginBubble" class="login-bubble">
            Logged in successfully
          </div>
          <div *ngIf="!(loginService.isLoggedIn() | async)" class="d-flex align-items-center">
            <button (click)="openLoginModal()" class="btn btn-primary ms-3 login">
              LOGIN
            </button>
          </div>
          <div *ngIf="(loginService.isLoggedIn() | async)" class="d-flex align-items-center">
            <div class="text-white me-3" style="font-size: 1.2rem; padding: 0.5rem 1rem;">
              Welcome, {{ (loginService.getUsername() | async) || 'User' }}!
            </div>
            <button (click)="loginService.logout();$event.stopPropagation()" class="btn btn-secondary ms-3 login">
              LOGOUT
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>
