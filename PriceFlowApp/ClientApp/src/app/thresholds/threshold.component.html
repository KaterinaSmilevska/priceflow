<div class="container mt-4">

  <div class="card p-4 shadow-sm">

    <h5 class="mb-3">
      {{ editingId ? 'Update Price Alert' : 'Add Price Alert' }}
    </h5>

    <div *ngIf="errorMessage"
         class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <form [formGroup]="form">
      <div class="mb-3">
        <label class="form-label">Security</label>

        <select class="form-select"
                formControlName="hvId">

          <option value="">Select security</option>

          <option *ngFor="let s of owned"
                  [value]="s.id"
                  [disabled]="isSecurityAlreadyUsed(s.id) && editingId === null">
            {{ s.hvCode }}
          </option>

        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Lower Threshold (%)</label>
        <input type="number"
               class="form-control"
               formControlName="lowerThreshold">
      </div>

      <div class="mb-3">
        <label class="form-label">Upper Threshold (%)</label>
        <input type="number"
               class="form-control"
               formControlName="upperThreshold">
      </div>

      <button class="btn btn-primary"
              type="button"
              (click)="submit()">
        {{ editingId ? 'Update' : 'Add' }}
      </button>

      <button *ngIf="editingId"
              class="btn btn-secondary ms-2"
              type="button"
              (click)="resetForm()">
        Cancel
      </button>

    </form>
  </div>

  <hr>

  <h5>My Price Alerts</h5>

  <table class="table table-bordered mt-3">
    <thead>
      <tr>
        <th>Security Code</th>
        <th>Lower %</th>
        <th>Upper %</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of thresholds">
        <td>{{ t.hvCode }}</td>
        <td>{{ t.lowerThreshold }}%</td>
        <td>{{ t.upperThreshold }}%</td>
        <td>
          <button class="btn btn-warning btn-sm me-2"
                  (click)="edit(t)">
            Edit
          </button>

          <button class="btn btn-danger btn-sm"
                  (click)="delete(t.id)">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>

</div>
