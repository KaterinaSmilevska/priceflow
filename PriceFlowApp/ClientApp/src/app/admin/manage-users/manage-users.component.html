<div class="users-container">
  <h2 class="page-title">Manage Users</h2>
  <div *ngIf="errorMessage" class="error-message">
    <p class="text-red-700">{{ errorMessage }}</p>
  </div>
  <div class="overflow-x-auto">
    <table class="users-table">
      <thead>
        <tr class="">
          <th class="py-2 px-4 border-b">Name</th>
          <th class="py-2 px-4 border-b">Username</th>
          <th class="py-2 px-4 border-b">Email</th>
          <th class="py-2 px-4 border-b">Roles</th>
          <th class="py-2 px-4 border-b">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users" class="hover:bg-gray-50">
          <td class="py-2 px-4 border-b">{{ user.name }}</td>
          <td class="py-2 px-4 border-b">{{ user.username }}</td>
          <td class="py-2 px-4 border-b">{{ user.email }}</td>
          <td class="py-2 px-4 border-b">{{ user.roles.join(', ') }}</td>
          <td class="py-2 px-4 border-b">
            <button (click)="editUser(user.id)"
                    class="btn btn-warning btn-sm me-3">
              Edit
            </button>

            <button *ngIf="currentUserId !== null && user.id !== currentUserId"
                    (click)="openDeleteModal(user)"
                    class="btn btn-danger">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <p class="mt-4 text-center">
    <a [routerLink]="['/']" class="page-link">Back to Home</a>
  </p>
</div>

<app-edit-user *ngIf="showEditModal"
               [userToEdit]="userToEdit!"
               (close)="onEditModalClose($event)">
</app-edit-user>

<div *ngIf="showDeleteModal" class="modal-overlay">
  <div class="modal-content animate-in">
    <h3>Confirm Delete</h3>
    <p>Are you sure you want to delete user <strong>{{ userToDelete?.username }}</strong>?</p>

    <div class="modal-actions">
      <button class="btn btn-danger" (click)="confirmDelete()">Delete</button>
      <button class="btn btn-secondary" (click)="closeDeleteModal()">Cancel</button>
    </div>
  </div>
</div>
