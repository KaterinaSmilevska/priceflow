<div class="modal-overlay">
  <div class="modal-content">
    <h4>{{ 'EDIT.ACTION_NAME' | translate }} {{ 'USERS.USER' | translate }}</h4>
    <form [formGroup]="editForm" (ngSubmit)="saveUser()">

      <div class="mb-3">
        <label>{{ 'USERS.NAME' | translate }}</label>
        <input class="form-control" formControlName="name">
      </div>

      <div class="mb-3">
        <label>{{ 'USERS.USERNAME' | translate }}</label>
        <input class="form-control" formControlName="username">
      </div>

      <div class="mb-3">
        <label>{{ 'USERS.EMAIL' | translate }}</label>
        <input type="email" class="form-control" formControlName="email">
      </div>

      <div class="text-end">
        <button type="button" class="btn btn-secondary me-2" (click)="cancel()">{{ 'CANCEL' | translate }}</button>
        <button type="submit" class="btn btn-primary">{{ 'SAVE_CHANGES' | translate }}</button>
      </div>

      <div *ngIf="errorMessage" class="error mt-2">{{ errorMessage | translate }}</div>
      <div *ngIf="successMessage" class="success-message mt-2">{{ successMessage | translate }}</div>
    </form>
  </div>
</div>
