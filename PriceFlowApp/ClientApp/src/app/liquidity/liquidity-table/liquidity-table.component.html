<div class="card shadow-sm border-0 h-100">
  <div class="card-body">

   <div class="d-flex justify-content-between align-items-center mb-3">
     <div class="text-uppercase small text-muted fw-semibold tracking">
       Liquidity
     </div>
     <div class="fw-semibold">
       {{ title }}
     </div>
   </div>

    <table class="table table-sm table-hover table-striped align-middle liquidity-table mb-0">
      <thead>
        <tr>
          <th>Security</th>
          <th class="text-end">Traded Qty</th>
          <th class="text-center">Trading Days</th>
        </tr>
      </thead>

      <tbody *ngIf="data?.length; else noData">
        <tr *ngFor="let s of data">
          <td class="fw-semibold">{{ s.securityCode }}</td>
          <td class="text-end fw-medium">{{ s.tradedQuantity | number }}</td>
          <td class="text-center">{{ s.tradingDays }}</td>
        </tr>
      </tbody>
    </table>

    <ng-template #noData>
      <div class="text-muted small text-center py-3">
        No data available
      </div>
    </ng-template>
  </div>
</div>
