<div class="card shadow-sm border-0 h-100 me-3">
  <div class="card-body">

   <div class="d-flex justify-content-between align-items-center mb-3">
     <div class="tracking">
       {{ 'LIQUIDITY.TITLE' | translate }}
     </div>
     <div class="fw-semibold">
       {{ title }}
     </div>
   </div>

    <table class="liquidity-table">
      <thead>
        <tr>
          <th>{{ 'SECURITIES.TITLE' | translate }}</th>
          <th class="text-end">{{ 'LIQUIDITY.TRADED_QTY' | translate }}</th>
          <th class="text-center">{{ 'LIQUIDITY.TRADING_DAYS' | translate }}</th>
        </tr>
      </thead>

      <tbody *ngIf="data?.length; else noData">
        <tr *ngFor="let s of data">
          <td class="fw-semibold">{{ s.securityCode }}</td>
          <td class="text-end fw-medium">{{ s.tradedQuantity | number }}</td>
          <td class="text-center">{{ s.tradingDays }}</td>
        </tr>
      </tbody>
    </table>

    <ng-template #noData>
      <div class="small py-3">
        {{ 'CHART.NO_DATA_AVAILABLE' | translate }}
      </div>
    </ng-template>
  </div>
</div>
