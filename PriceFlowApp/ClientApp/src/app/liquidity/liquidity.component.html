<div class="container-fluid">

  <div class="d-flex justify-content-between align-items-center">
    <div>
      <h5 class="mb-1 fw-semibold">{{ 'LIQUIDITY.MARKET_LIQUIDITY_OVERVIEW' | translate }}</h5>
      <div class="info">
        {{ 'LIQUIDITY.DESCRIPTION' | translate }}
      </div>
    </div>

    <select class="form-select form-select-sm w-auto me-3"
            [(ngModel)]="months"
            (change)="loadLiquidity()">
      <option [value]="3">{{ 'LAST' | translate }} 3 {{ 'MONTHS' | translate }}</option>
      <option [value]="6">{{ 'LAST' | translate }} 6 {{ 'MONTHS' | translate }}</option>
      <option [value]="12">{{ 'LAST' | translate }} 12 {{ 'MONTHS' | translate }}</option>
    </select>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <app-liquidity-table [title]="('MOST' | translate) + ' ' + ('LIQUIDITY.LIQUID' | translate) + ' (' + ('LIQUIDITY.TRADED_QTY' | translate) + ')'"
                           [data]="liquidity.mostByTradedQuantity">
      </app-liquidity-table>
    </div>

    <div class="col-md-6">
      <app-liquidity-table [title]="('LEAST' | translate) + ' ' + ('LIQUIDITY.LIQUID' | translate) + ' (' + ('LIQUIDITY.TRADED_QTY' | translate) + ')'"
                           [data]="liquidity.leastByTradedQuantity">
      </app-liquidity-table>
    </div>

    <div class="col-md-6">
      <app-liquidity-table [title]="('MOST' | translate) + ' ' + ('LIQUIDITY.LIQUID' | translate) + ' (' + ('LIQUIDITY.TRADING_DAYS' | translate) + ')'"
                           [data]="liquidity.mostByTradingDays">
      </app-liquidity-table>
    </div>

    <div class="col-md-6">
      <app-liquidity-table [title]="('LEAST' | translate) + ' ' + ('LIQUIDITY.LIQUID' | translate) + ' (' + ('LIQUIDITY.TRADING_DAYS' | translate) + ')'"
                           [data]="liquidity.leastByTradingDays">
      </app-liquidity-table>
    </div>

    <div *ngIf="noDataMessage" class="error mt-2">{{ noDataMessage | translate }}</div>

  </div>
</div>
