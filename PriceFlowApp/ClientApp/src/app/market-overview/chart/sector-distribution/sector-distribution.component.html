<div class="chart-container">
  <div class="chart-header" *ngIf="date && !noDataMessage">
    <span>Showing data for {{ date }}</span>
  </div>

  <ng-container *ngIf="!noDataMessage; else noData">
    <canvas baseChart [data]="data" [type]="type"></canvas>
  </ng-container>

  <ng-template #noData>
    <div class="no-data-message">{{ noDataMessage | translate }}</div>
  </ng-template>
</div>
