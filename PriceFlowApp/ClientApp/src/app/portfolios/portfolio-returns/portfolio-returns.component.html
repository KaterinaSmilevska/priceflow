<div class="card shadow-sm h-80">
  <div class="card-body">

    <h5 class="mb-3">{{ 'PORTFOLIOS.PORTFOLIO_RETURNS' | translate }}</h5>

    <form [formGroup]="form" (ngSubmit)="save()">

      <div class="mb-3">
        <label class="form-label">{{ 'DATE' | translate }}</label>
        <input type="date"
               class="form-control w-100"
               formControlName="date">
      </div>

      <div class="mb-3">
        <label class="form-label">{{ 'SECURITIES.TITLE' | translate }}</label>
        <select class="form-select"
                formControlName="hvId">
          <option [ngValue]="null">{{ 'SELECT' | translate }} {{ 'SECURITIES.TITLE' | translate }}</option>
          <option *ngFor="let s of securities" [value]="s.id">
            {{ s.code }}
          </option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">{{ 'PORTFOLIOS.DIVIDEND' | translate }}</label>
        <input type="number"
               class="form-control w-100"
               formControlName="netAmount">
      </div>

      <div class="mb-3">
        <label class="form-label">{{ 'PORTFOLIOS.TAX' | translate }}</label>
        <input type="number"
               class="form-control w-100"
               formControlName="tax">
      </div>

      <button class="btn btn-success w-100" type="submit" [disabled]="form.invalid">
        {{ 'ADD.ACTION_NAME' | translate }} {{ 'PORTFOLIOS.RETURN' | translate }}
      </button>
    </form>

    <hr />

    <div *ngIf="summary" class="text-center">
      <div class="small">{{ 'PORTFOLIOS.TOTAL_DIVIDEND' | translate }}</div>
      <div class="fw-bold text-success">
        {{ summary.totalDividends | number:'1.2-2' }} {{ 'CURRENCY.MKD' | translate }}
      </div>

      <div class="small mt-2">{{ 'PORTFOLIOS.TOTAL_TAXES' | translate }}</div>
      <div class="fw-bold text-warning">
        {{ summary.totalTaxes | number:'1.2-2' }} {{ 'CURRENCY.MKD' | translate }}
      </div>
    </div>

  </div>
</div>
