<div class="modal fade show" tabindex="-1" style="display: block;">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content animate-in">

      <div class="modal-header">
        <h5 class="modal-title">
          {{ portfolioToEdit ? 'Edit Portfolio' : 'Add Portfolio' }}
        </h5>
        <button type="button" class="btn-close" (click)="onCancel()"></button>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="modal-body">

          <label class="form-label">Portfolio Name</label>
          <input class="form-control mb-3" formControlName="name">

          <label class="form-label">Description</label>
          <textarea class="form-control portfolio-textarea"
                    maxlength="100"
                    formControlName="description"></textarea>

          <small class="text-muted">
            {{ form.get('description')?.value?.length || 0 }}/100
          </small>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
            {{ portfolioToEdit ? 'Save Changes' : 'Add Portfolio' }}
          </button>
        </div>

      </form>

    </div>
  </div>
</div>

<div class="modal-backdrop fade show"></div>
